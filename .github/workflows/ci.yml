name: Agentic SDLC CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  ci-gate:
    name: ci-gate

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Agentic SDLC structure
        run: |
          python .github/scripts/validate_agentic_sdlc.py

      - name: Run project CI
        shell: bash
        run: |
          bash scripts/ci.sh
